# Пример: медиа-хост, где 443 уже держит nginx stream (ssl_preread).
# lk./turn. передаются Caddy на 127.0.0.1:8443 без расшифровки; Caddy сам получает сертификаты (TLS-ALPN проходит насквозь).
map $ssl_preread_server_name $sni_upstream {
    hostnames;
    lk.example.com     media;
    turn.example.com   media;
    # ... остальные ваши имена ...
    default            closed;
}
upstream media  { server 127.0.0.1:8443; }
upstream closed { server 127.0.0.1:9; }

server {
    listen 443 reuseport;
    ssl_preread on;
    proxy_pass $sni_upstream;
    proxy_protocol on;          # Caddy примет заголовок с loopback; LiveKit/TURN увидят IP клиента
    proxy_timeout 1h;           # долгие wss / TURN-соединения
}
