[package]
name = "client"
description = "Amadeus — десктоп-клиент (голос)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "amadeus"
path = "src/main.rs"

[dependencies]
proto = { path = "../proto" }
# rustls-tls-native-roots: нужен для WSS через HTTP-прокси (HTTPS_PROXY, напр. v2rayN); корни — из хранилища Windows.
livekit = { version = "0.11.0", features = ["rustls-tls-native-roots"] }
eframe = "0.36"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "system-proxy", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
] }
