[package]
name = "client"
description = "Amadeus — десктоп-клиент (голос)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "amadeus"
path = "src/main.rs"

# Установщик: `cargo packager -p client --release` (NSIS, в профиль пользователя, без прав администратора).
# Полный выпуск (установщик + файлы для автообновления на сервер) — scripts/release.sh.
[package.metadata.packager]
productName = "Amadeus"
identifier = "ru.steins-gate.amadeus"
publisher = "Amadeus"
formats = ["nsis"]
icons = ["assets/icon.ico"]
beforePackagingCommand = "cargo build -p client --release"

[package.metadata.packager.nsis]
installMode = "currentUser"
languages = ["Russian"]
customLanguageFiles = { Russian = "packaging/nsis/Russian.nsh" }
installerIcon = "assets/icon.ico"
# при удалении — галочка «удалить настройки» (по умолчанию выключена)
appdataPaths = ["$APPDATA/$PRODUCTNAME"]

[dependencies]
proto = { path = "../proto" }
capture-win = { path = "../capture-win" }
msvc-shim = { path = "../msvc-shim" }
# rustls-tls-native-roots: нужен для WSS через HTTP-прокси (HTTPS_PROXY, напр. v2rayN); корни — из хранилища Windows.
livekit = { version = "0.11.0", features = ["rustls-tls-native-roots"] }
eframe = "0.36"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "http2", "system-proxy", "charset", "gzip", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
futures-util = "0.3"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
arboard = "3"
rfd = "0.18"
raw-window-handle = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
